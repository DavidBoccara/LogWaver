# =============================================================================
# Didacticiel de LogWaver - fichier modifiable à la main
# -----------------------------------------------------------------------------
# [tutorial] steps = ordre des étapes.
# Chaque [step:<id>] accepte :
#   title         titre de l'étape
#   text          explication (HTML simple : <b>, <i>, <br>) ; les lignes
#                 suivantes doivent être indentées pour continuer le texte
#   target        objectName du widget à encadrer (facultatif)
#   action        action réalisée par le bouton « Montre-moi » (facultatif) :
#                 load_sample, show_unclassified, show_all, group_by_code,
#                 group_by_file, ungroup, select_first, justify, undo
#   action_label  libellé du bouton d'action
# =============================================================================

[tutorial]
title = Découvrir LogWaver
steps = bienvenue, guide, categories, liste, regrouper, selectionner, justifier,
    resultat, par_fichier, annuler, aide, retirer, enregistrer, partager, exporter, fin

[step:bienvenue]
title = Bienvenue !
text = LogWaver vous aide à <b>trier et justifier</b> les notes, warnings et erreurs
    d'un fichier de log.<br><br>
    Nous allons travailler sur un exemple : le log d'un outil fictif nommé
    <b>TINTIN</b>. Cliquez sur le bouton ci-dessous pour l'ouvrir.
action = load_sample
action_label = Ouvrir l'exemple

[step:guide]
title = Le bandeau « À faire »
text = Ce bandeau vous dit toujours <b>quoi faire ensuite</b> et combien d'éléments
    restent à justifier.<br><br>
    L'outil TINTIN a été <b>reconnu automatiquement</b> : vous n'avez pas besoin de
    choisir de plugin.
target = GuideBanner

[step:categories]
title = Les catégories
text = À gauche, chaque catégorie indique son nombre d'éléments.<br><br>
    Vous êtes dans <b>Non justifiés</b> : c'est votre liste de travail. Chaque élément
    justifié quitte cette liste et rejoint sa catégorie (Justifié, Rejeté…).
target = CategoryList
action = show_unclassified
action_label = Afficher les non justifiés

[step:liste]
title = La liste des éléments
text = Chaque ligne est un élément extrait du log : son type, son code, le fichier et
    la ligne concernés, et sa description.<br><br>
    Cliquez sur un titre de colonne pour trier. Le champ de recherche, au-dessus,
    filtre instantanément.
target = EntryTree

[step:regrouper]
title = Regrouper les éléments identiques
text = Les mêmes messages reviennent souvent. Le menu <b>Regrouper par</b> les
    rassemble : par code, par fichier, par description identique… ou par n'importe
    quel champ extrait.<br><br>
    Essayons de regrouper <b>par code</b>.
target = GroupingCombo
action = group_by_code
action_label = Regrouper par code

[step:selectionner]
title = Sélectionner un groupe entier
text = Chaque groupe est replié et affiche son nombre d'éléments. Cliquez sur la petite
    flèche pour le déplier.<br><br>
    <b>Sélectionner la ligne d'un groupe sélectionne tous ses éléments.</b>
    Sélectionnons le premier groupe.
target = EntryTree
action = select_first
action_label = Sélectionner le premier groupe

[step:justifier]
title = Justifier en un clic
text = Cliquez sur <b>✔ Justifier</b> (ou double-cliquez sur un élément).<br><br>
    Une fenêtre s'ouvre : choisissez la catégorie, écrivez en une phrase pourquoi,
    puis validez. Votre nom est demandé <b>une seule fois</b> et sera inscrit sur
    chaque justification.
target = JustifyButton
action = justify
action_label = Justifier ce groupe

[step:resultat]
title = Le groupe a changé de catégorie
text = Les éléments justifiés ont quitté la liste « Non justifiés » : leur nombre a
    baissé à gauche et ils apparaissent dans leur nouvelle catégorie.<br><br>
    Cliquez sur une catégorie pour voir son contenu.
target = CategoryList
action = show_all
action_label = Voir tous les éléments

[step:par_fichier]
title = Un autre regroupement : par fichier
text = Vous pouvez aussi regrouper <b>par fichier</b> : sélectionner un fichier permet
    alors de justifier d'un coup tous les warnings de ce fichier.
target = GroupingCombo
action = group_by_file
action_label = Regrouper par fichier

[step:annuler]
title = Droit à l'erreur
text = Une erreur ? <b>Annuler</b> (Ctrl+Z) défait la dernière action, et
    <b>Rétablir</b> (Ctrl+Y) la refait. Aucune action n'est définitive.
target = ToolbarButton_undo
action = undo
action_label = Annuler la dernière action

[step:aide]
title = Besoin d'aide pour décider ?
text = Pour un élément sélectionné, le panneau de droite propose :<br>
    • <b>Demander à l'IA</b> : une explication et une proposition de justification ;<br>
    • <b>Voir la documentation</b> : le manuel de l'outil, ouvert à la bonne page ;<br>
    • <b>Ouvrir le fichier source</b> : directement à la ligne concernée.
target = AiButton

[step:retirer]
title = Retirer une justification
text = Sélectionnez un élément justifié puis <b>Retirer la justification</b> (touche
    Suppr) : il redevient « non justifié ».
target = UnjustifyButton

[step:enregistrer]
title = Enregistrer son travail
text = <b>Enregistrer</b> (Ctrl+S) crée un fichier projet. En le rouvrant avec un
    nouveau log, <b>toutes vos justifications se réappliquent automatiquement</b> :
    il ne vous reste que les nouveaux éléments.
target = ToolbarButton_save_project

[step:partager]
title = Partager avec un collègue
text = Votre code passe à un collègue ? Menu <b>Fichier &gt; Partager mes
    justifications</b> crée un petit fichier à lui transmettre.<br><br>
    De son côté, <b>Fichier &gt; Récupérer les justifications d'un collègue</b> les
    applique à son propre log : il ne garde que les éléments vraiment nouveaux.

[step:exporter]
title = Exporter vers Excel
text = <b>Exporter vers Excel</b> (Ctrl+E) produit un classeur avec la synthèse, le
    détail de chaque élément et toutes les justifications. Un rapport Word est aussi
    disponible dans le menu Fichier.
target = ToolbarButton_export_excel

[step:fin]
title = C'est à vous !
text = Vous connaissez l'essentiel. Ouvrez votre propre log avec <b>Ouvrir un
    log</b>.<br><br>
    Ce didacticiel reste disponible à tout moment avec le bouton
    <b>Didacticiel</b> (Maj+F1).
target = ToolbarButton_tutorial
