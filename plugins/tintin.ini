# =============================================================================
# Plugin LogWaver pour l'outil TINTIN
# -----------------------------------------------------------------------------
# Format des lignes de log TINTIN :
#   [2026-11-20 10:01:02] WARNING CL245 src/io/loader.c:42 - message
#
# Pour chaque type :
#   detect        = regex qui identifie une ligne de ce type
#   fields        = champs à extraire, dans l'ordre d'affichage
#   regex.<champ> = regex d'extraction du champ. La valeur extraite est le
#                   groupe nommé (?P<value>...) s'il existe, sinon le premier
#                   groupe capturant, sinon la correspondance complète.
# Les chemins relatifs sont résolus par rapport au dossier de ce fichier.
# file_extensions : extensions des logs de l'outil (choix automatique du plugin).
# =============================================================================

[plugin]
tool_name = TINTIN
element_types = Note, Warning, Error
# Extensions des logs TINTIN : un fichier portant l'une d'elles est
# automatiquement associé à ce plugin.
file_extensions = .log, .tlog
pdf_documentation = tintin_manual.pdf
pdf_page_index = tintin_pdf_index.ini

[type:Note]
detect = ^\[[^\]]+\]\s+NOTE\s
fields = file, line, code, description
regex.file = NOTE\s+\S+\s+([^:\s]+):\d+
regex.line = NOTE\s+\S+\s+[^:\s]+:(\d+)
regex.code = NOTE\s+(\S+)
regex.description = \s-\s(?P<value>.*)$

[type:Warning]
detect = ^\[[^\]]+\]\s+WARNING\s
fields = file, line, code, description
regex.file = WARNING\s+\S+\s+([^:\s]+):\d+
regex.line = WARNING\s+\S+\s+[^:\s]+:(\d+)
regex.code = WARNING\s+(\S+)
regex.description = \s-\s(?P<value>.*)$

[type:Error]
detect = ^\[[^\]]+\]\s+ERROR\s
fields = file, line, code, description
regex.file = ERROR\s+\S+\s+([^:\s]+):\d+
regex.line = ERROR\s+\S+\s+[^:\s]+:(\d+)
regex.code = ERROR\s+(\S+)
regex.description = \s-\s(?P<value>.*)$
