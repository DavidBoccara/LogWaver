# =============================================================================
# Configuration de LogWaver (distincte des fichiers plugin)
# =============================================================================

[statuses]
# Ordre d'affichage des catégories de classement (identifiants techniques).
order = todo, investigation, justified, rejected, closed

[status:todo]
label = À traiter
description = Nouvelle exception détectée, non encore analysée.
color = #e0a000

[status:investigation]
label = En cours d'analyse
description = Un analyste examine le log pour comprendre l'origine.
color = #2f7fd0

[status:justified]
label = Justifié / Accepté
description = L'exception est validée et ne doit plus générer d'alerte.
color = #2e9d4f

[status:rejected]
label = Rejeté
description = L'exception n'est pas acceptable, le problème doit être corrigé.
color = #d03b3b

[status:closed]
label = Clôturé
description = Le problème a été résolu techniquement (le log n'apparaît plus).
color = #7d7d7d

[matching]
# Attributs constituant l'empreinte qui relie un élément à sa justification.
# Valeurs possibles : tool, type, code, description, file_name, file_path, line
# N'incluez pas « line » si les justifications doivent survivre aux
# modifications du code source ou être transmises à un autre concepteur.
keys = tool, type, code, description, file_name
normalize_whitespace = true
ignore_case = false

[editor]
# Commande optionnelle d'un éditeur externe pour « Aller à la ligne ».
# Jetons disponibles : {file} et {line}. Laisser vide = visionneuse intégrée.
# Exemples :  code -g "{file}:{line}"   |   notepad++ -n{line} "{file}"
command =

[ai]
# Langue des prompts générés : fr ou en
language = fr
