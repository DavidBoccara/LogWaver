name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verification:
    name: Vérification
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.8", "3.10", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Bibliothèques système Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3

      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Style PEP 8
        run: python -m pycodestyle main.py logwaver tests tools

      - name: Analyse statique
        run: python -m pyflakes logwaver tests tools

      - name: Architecture MVP (le modèle n'importe pas Qt)
        shell: bash
        run: |
          if grep -rnE "^\s*(from|import) PyQt5" logwaver/model; then
            echo "::error::La couche modèle ne doit pas dépendre de PyQt5"
            exit 1
          fi

      - name: Tests
        run: python -m unittest discover -s tests -t . -v

  release:
    name: Publication
    needs: verification
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Notes de version extraites du CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > release_notes.md
          test -s release_notes.md || { echo "::error::Version $version absente du CHANGELOG"; exit 1; }

      - name: Archive source
        run: git archive --format=zip --prefix="LogWaver-${GITHUB_REF_NAME}/" -o "LogWaver-${GITHUB_REF_NAME}.zip" "${GITHUB_REF_NAME}"

      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "LogWaver-${GITHUB_REF_NAME}.zip" \
            --title "LogWaver ${GITHUB_REF_NAME}" --notes-file release_notes.md
